<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DELTA | Proyectos y servicios</title>
    <meta
      name="description"
      content="Delta es una empresa nueva de infraestructura industrial. Obra civil, preparación de sitio y soporte para proyectos de energía e industria."
    />
    <meta name="theme-color" content="#a00000" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <div class="stage" id="stage">
      <div class="bg" id="bg" aria-hidden="true"></div>
      <div class="bg-scrim" aria-hidden="true"></div>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
        <span class="sr-only" id="theme-label">Activar tema claro</span>
      </button>

      <aside class="rail" aria-label="Índice">
        <img class="rail__logo" id="rail-logo" src="logo.png" alt="Delta. Proyectos y servicios." />
        <p class="rail__kicker">Índice</p>
        <nav class="rail__nav" id="rail-nav"></nav>
      </aside>

      <div class="viewport" id="contenido">
        <noscript>
          <p class="boot">Activa JavaScript para ver el sitio.</p>
        </noscript>
      </div>

      <div class="fabs">
        <button class="fab fab-mail" id="mail-fab" type="button" data-go="contacto" aria-label="Escribir a Delta">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5L4 8V6l8 5 8-5Z"
            />
          </svg>
        </button>
      </div>

      <nav class="dock" id="dock" aria-label="Índice móvil"></nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
